name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24   # Firebase needs >= 24.12, Expo SDK 58 accepts ^24.3
          cache: npm
          cache-dependency-path: app/package-lock.json
      # npm's download cache occasionally trips over itself on CI (EEXIST/ENOENT rename in
      # _cacache). If that happens, clear the cache and install once more.
      - name: Install
        run: npm ci || (npm cache clean --force && npm ci)
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Test
        run: npm test --if-present

  rules:
    # Proves firestore.rules against the Firestore emulator (needs Java).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v4
        with:
          node-version: 24   # Firebase needs >= 24.12, Expo SDK 58 accepts ^24.3
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install
        run: npm ci || (npm cache clean --force && npm ci)
        working-directory: app
      - name: Security rules tests (Firestore emulator)
        run: npx --yes firebase-tools@15.37.0 emulators:exec --only firestore --project demo-attendly "npm --prefix app run test:rules"
